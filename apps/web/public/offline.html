<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Servis Defteri</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #eef2f7;
        color: #111827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100% - 32px));
        border: 1px solid #d9e0ea;
        border-radius: 8px;
        padding: 24px;
        background: #ffffff;
        box-shadow: 0 10px 28px rgba(31, 41, 55, 0.06);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.4rem;
      }
      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı yok</h1>
      <p>Servis Defteri açıldı ama güncel talepler için internet bağlantısı gerekiyor.</p>
    </main>
  </body>
</html>
