services:
  - type: web
    name: islik-cloud-api
    runtime: node
    branch: main
    rootDir: apps/api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://islik-cloud.vercel.app
      - key: PUBLIC_SERVICE_OWNER_EMAIL
        sync: false
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "30"
      - key: PUBLIC_REQUEST_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: PUBLIC_REQUEST_RATE_LIMIT_MAX
        value: "60"
