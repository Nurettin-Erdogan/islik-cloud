name: Production Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify production API
        env:
          SMOKE_BASE_URL: https://islik-cloud-api.onrender.com
          SMOKE_TIMEOUT_MS: "90000"
        working-directory: apps/api
        run: npm run smoke:production
