name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Start API
        run: |
          npm start &
          echo $! > /tmp/islik-api.pid
          sleep 3

      - name: Check health endpoint
        run: curl --fail http://localhost:4000/health

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/islik-api.pid ]; then
            kill $(cat /tmp/islik-api.pid) || true
          fi
