name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: islik
          POSTGRES_PASSWORD: islik_password
          POSTGRES_DB: islik_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U islik -d islik_cloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://islik:islik_password@localhost:5432/islik_cloud
      JWT_SECRET: ci-test-secret
      AUTH_RATE_LIMIT_MAX: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Start API
        run: |
          npm start &
          echo $! > /tmp/islik-api.pid
          sleep 3

      - name: Check health endpoint
        run: curl --fail http://localhost:4000/health

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/islik-api.pid ]; then
            kill $(cat /tmp/islik-api.pid) || true
          fi
